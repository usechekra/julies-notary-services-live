<style>
:root{--ink:#153229;--deep:#0d251d;--accent:#963f2c;--paper:#f6f3ec;--muted:#5b6961;--line:#d8ded9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}.card{width:min(680px,calc(100% - 36px));background:#fff;border:1px solid var(--line);padding:clamp(30px,7vw,70px);box-shadow:0 22px 60px rgba(13,37,29,.12)}.mark{width:54px;height:54px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-weight:900;color:var(--accent)}h1{font:700 clamp(2.5rem,7vw,4.8rem)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:24px 0 18px}p{color:var(--muted);font-size:1.08rem}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:12px 20px;border-radius:4px;background:var(--deep);color:#fff;text-decoration:none;font-weight:850}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}a:focus-visible{outline:3px solid #f5bd48;outline-offset:3px}
</style>
</head>
<body>
<main class="card">

</body>
